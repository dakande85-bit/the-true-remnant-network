name: Publish Spiritual Warfare PDF
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/data/flagship.ts'
      - 'scripts/build_flagship_pdf.py'
      - '.github/workflows/publish-flagship-pdf.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab
      - run: python scripts/build_flagship_pdf.py
      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/spiritual-warfare-standing-firm-in-christ.pdf
          git diff --cached --quiet || (git commit -m "Publish typeset flagship eBook PDF" && git push)
